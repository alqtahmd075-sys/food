services:
  - type: web
    name: stars-restaurant
    runtime: node
    plan: free
    # npm run images: بيحمّل أي صور ناقصة (لو الصور مرفوعة في الريبو بيتخطاها). مش بيوقف البناء لو فشل.
    buildCommand: npm install && npm run images
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      # قاعدة بيانات دائمة (Supabase Postgres) — راجع README. من غيرها الداتا بتتمسح مع كل إعادة تشغيل.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
